<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>11.04🍉合集</title>
  <link href="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/tcplayer.min.css" rel="stylesheet" />
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/libs/hls.min.0.13.2m.js"></script>
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.5.0/tcplayer.v4.5.0.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #e0f7ff, #ffffff);
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #111;
      margin-bottom: 30px;
    }

    .video-block {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 15px;
      margin-bottom: 30px;
    }

    .video-title {
      display: block;
      background: #0094ff;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      text-align: left; /* 修改为靠左对齐 */
    }

    .video-title:hover {
      background: #0079cc;
    }

    .tcplayer-container {
      display: none;
      width: 100%;
      height: 580px;
      max-width: 1080px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
    }

    .jump-btn {
      display: none;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #ff6a00;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .jump-btn:hover {
      background-color: #e85c00;
    }
  </style>
</head>
<body>
  <h1>11.04🍉合集</h1>
  <div id="content">加载中...</div>

  <script>
    const players = [];
    let currentPlayingIndex = null;

    function getLocalData() {
      return {
        data_mp4: [
          { title: "吃🍉500块找的上门🐔 服务不错哦", url: "http://aod.cos.tx.xmcdn.com/storages/1f0a-audiofreehighqps/C9/31/GAqhfZkM31orACAAAAQv1HAT.mp4" },
          { title: "吃🍉今日份探店🐔，广东汕头小巷子，质量还可以啊！", url: "http://aod.cos.tx.xmcdn.com/storages/bfa9-audiofreehighqps/79/59/GAqhfD0M31qnACAAAAQv1LXy.mp4" },
          { title: "吃🍉完了抽搐了😱", url: "http://aod.cos.tx.xmcdn.com/storages/656e-audiofreehighqps/F9/F6/GKwRIJEM31r7ACAAAAQv1N2h.mp4" },
          { title: "吃🍉这不是送人头吗 ？🚆来了", url: "http://aod.cos.tx.xmcdn.com/storages/acb7-audiofreehighqps/E1/99/GKwRIJIM31vUACAAAAQv1T-y.mp4" },
          { title: "吃🍉为了赚这几百块也是不容易🐔", url: "http://aod.cos.tx.xmcdn.com/storages/2d68-audiofreehighqps/8D/33/GAqhfZkM31wuACAAAAQv1W5v.mp4" },
          { title: "吃🍉小小年纪，人生就达到了巅峰…", url: "http://aod.cos.tx.xmcdn.com/storages/1f44-audiofreehighqps/E3/7F/GAqh9sAM31yrABszNgQv1bTr.mp4" },
          { title: "吃🍉精神小妹霸凌他人，长的还挺好看的 😭 我想帮帮她", url: "http://aod.cos.tx.xmcdn.com/storages/8458-audiofreehighqps/39/03/GAqhg3wM31zzACAAAAQv1e54.mp4" },
          { title: "吃🍉女主播pk 输了喝自己的尿，黄黄的有点上火啊！", url: "http://aod.cos.tx.xmcdn.com/storages/96aa-audiofreehighqps/B7/A9/GKwRIRwM311jACAAAAQv1ixo.mp4" },
          { title: "吃🍉外卖奇遇，外卖也不送了 ？ 遇到 #醉酒 #骚鸡 送她回家", url: "http://aod.cos.tx.xmcdn.com/storages/4851-audiofreehighqps/5F/B1/GAqhntAM3134ACAAAAQv1m9u.mp4" },
          { title: "吃🍉当街 #暴打 #小三，内裤都给扒了 ", url: "http://aod.cos.tx.xmcdn.com/storages/4f00-audiofreehighqps/50/D0/GAqhqKwM315yACAAAAQv1qtC.mp4" },
          { title: "吃🍉地铁 #瘙🐔 怎么穿成这样了 ？", url: "http://aod.cos.tx.xmcdn.com/storages/ba18-audiofreehighqps/69/09/GKwRIJIM317_ACAAAAQv1vw7.mp4" },
          { title: "吃🍉今日快手抖音露出闪现合集", url: "http://aod.cos.tx.xmcdn.com/storages/ed1a-audiofreehighqps/BA/51/GKwRIaIM31_xACAAAAQv13hR.mp4" },
        ],
        btn_text: '加入吃瓜微信群',
        btn_link: 'https://mp.weixin.qq.com/s/uGSBdlVlSHMpXLkxdOlHOA',
        title: '转发＝更新的动力'
      };
    }

    async function loadVideos() {
      const data = getLocalData();
      document.title = data.title;

      const container = document.getElementById('content');
      container.innerHTML = '';

      data.data_mp4.forEach((item, index) => {
        const videoId = "tcplayer-container-" + index;
        const block = document.createElement('div');
        block.className = 'video-block';
        block.innerHTML = `
          <span class="video-title" data-index="${index}">${index + 1}. ${item.title}</span>
          <video id="${videoId}" class="tcplayer-container" preload="auto" playsinline webkit-playsinline></video>
          <button class="jump-btn">${data.btn_text}</button>
        `;
        container.appendChild(block);

        const jumpBtn = block.querySelector('.jump-btn');
        jumpBtn.onclick = () => window.location.href = data.btn_link;

        setTimeout(() => {
          const player = TCPlayer(videoId, { reportable: false });
          player.src(item.url);
          player.pause();
          players[index] = player;
        }, 0);
      });

      document.querySelectorAll('.video-title').forEach(titleElem => {
        titleElem.addEventListener('click', function () {
          const index = parseInt(this.getAttribute('data-index'));
          if (currentPlayingIndex === index) return;

          if (currentPlayingIndex !== null) {
            const prevVideoElem = document.getElementById("tcplayer-container-" + currentPlayingIndex);
            if (prevVideoElem) prevVideoElem.style.display = 'none';
            const prevBlock = prevVideoElem?.parentElement;
            prevBlock?.querySelector('.jump-btn')?.style.setProperty('display', 'none');
            players[currentPlayingIndex]?.pause();
          }

          const currentVideoElem = document.getElementById("tcplayer-container-" + index);
          currentVideoElem.style.display = 'block';
          const currentBlock = this.parentElement;
          currentBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
          currentBlock.querySelector('.jump-btn').style.display = 'block';
          players[index]?.play();
          currentPlayingIndex = index;
        });
      });
    }

    loadVideos();
  </script>
</body>
</html>
