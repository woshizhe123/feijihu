<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>11.08🍉合集</title>
  <link href="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/tcplayer.min.css" rel="stylesheet" />
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/libs/hls.min.0.13.2m.js"></script>
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.5.0/tcplayer.v4.5.0.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #e0f7ff, #ffffff);
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #111;
      margin-bottom: 30px;
    }

    .video-block {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 15px;
      margin-bottom: 30px;
    }

    .video-title {
      display: block;
      background: #0094ff;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      text-align: left; /* 修改为靠左对齐 */
    }

    .video-title:hover {
      background: #0079cc;
    }

    .tcplayer-container {
      display: none;
      width: 100%;
      height: 580px;
      max-width: 1080px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
    }

    .jump-btn {
      display: none;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #ff6a00;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .jump-btn:hover {
      background-color: #e85c00;
    }
  </style>
</head>
<body>
  <h1>11.08🍉合集</h1>
  <div id="content">加载中...</div>

  <script>
    const players = [];
    let currentPlayingIndex = null;

    function getLocalData() {
      return {
        data_mp4: [
          { title: "吃🍉骚🐔，羡慕这椅子", url: "http://aod.cos.tx.xmcdn.com/storages/eab8-audiofreehighqps/83/46/GAqhfZkM485AABdEwgQx2-nK.mp4" },
          { title: "吃🍉精神小妹，1v1 #撕逼", url: "http://aod.cos.tx.xmcdn.com/storages/6494-audiofreehighqps/D0/26/GKwRIW4M4885ACAAAAQx3JEG.mp4" },
          { title: "吃🍉发骚了 ？ 想日大树 🌳", url: "http://aod.cos.tx.xmcdn.com/storages/bbeb-audiofreehighqps/83/FA/GKwRIaIM48-WAAs3aQQx3NG7.mp4" },
          { title: "吃🍉浅尝一下，羡慕了...", url: "http://aod.cos.tx.xmcdn.com/storages/adc4-audiofreehighqps/7A/C5/GAqhntAM49AAACAAAAQx3SHa.mp4" },
          { title: "吃🍉分手了还来捉奸？真不要逼脸！暴揍👊", url: "http://aod.cos.tx.xmcdn.com/storages/42ba-audiofreehighqps/E3/5F/GAqh4zIM49DAACAAAAQx3bJq.mp4" },
          { title: "吃🍉红灯区 #站街女 都是 #鸡🐔几米的故事 ！.", url: "http://aod.cos.tx.xmcdn.com/storages/a00e-audiofreehighqps/DA/8E/GKwRIDoM49G1ACAAAAQx3ki7.mp4" },
          { title: "吃🍉纹身 boy #恋足 小咖 猛嘬 #恋足 #舔脚 🦶 啥味 ？ ", url: "http://aod.cos.tx.xmcdn.com/storages/9e95-audiofreehighqps/32/9E/GKwRIW4M49L4ACAAAAQx3vjq.mp4" },
          { title: "吃🍉伪娘？", url: "http://aod.cos.tx.xmcdn.com/storages/32f8-audiofreehighqps/26/E1/GAqhfZkM49P8AAY2_wQx33TN.mp4" },
          { title: "吃🍉回头嘴上长菜花🥦", url: "http://aod.cos.tx.xmcdn.com/storages/fe43-audiofreehighqps/17/E5/GAqhVp8M49TYACAAAAQx39QQ.mp4" },
          { title: "吃🍉两个人加起来130岁还出来偷情 #吃瓜 #捉奸  ", url: "http://aod.cos.tx.xmcdn.com/storages/a0d9-audiofreehighqps/C4/1B/GKwRIasM49XCACAAAAQx4ErX.mp4" },
          { title: "吃🍉这是怎么了，拔不出来了吗？人🐕？", url: "http://aod.cos.tx.xmcdn.com/storages/eb61-audiofreehighqps/13/26/GKwRIUEM49ZmABTqBQQx4JOS.mp4" },
          { title: "吃🍉今日快手抖音闪现合集", url: "http://aod.cos.tx.xmcdn.com/storages/abbd-audiofreehighqps/FB/0D/GKwRIW4M49f_ACAAAAQx4Tor.mp4" },
        ],
        btn_text: '加入吃瓜微信群',
        btn_link: 'https://mp.weixin.qq.com/s/uGSBdlVlSHMpXLkxdOlHOA',
        title: '转发＝更新的动力'
      };
    }

    async function loadVideos() {
      const data = getLocalData();
      document.title = data.title;

      const container = document.getElementById('content');
      container.innerHTML = '';

      data.data_mp4.forEach((item, index) => {
        const videoId = "tcplayer-container-" + index;
        const block = document.createElement('div');
        block.className = 'video-block';
        block.innerHTML = `
          <span class="video-title" data-index="${index}">${index + 1}. ${item.title}</span>
          <video id="${videoId}" class="tcplayer-container" preload="auto" playsinline webkit-playsinline></video>
          <button class="jump-btn">${data.btn_text}</button>
        `;
        container.appendChild(block);

        const jumpBtn = block.querySelector('.jump-btn');
        jumpBtn.onclick = () => window.location.href = data.btn_link;

        setTimeout(() => {
          const player = TCPlayer(videoId, { reportable: false });
          player.src(item.url);
          player.pause();
          players[index] = player;
        }, 0);
      });

      document.querySelectorAll('.video-title').forEach(titleElem => {
        titleElem.addEventListener('click', function () {
          const index = parseInt(this.getAttribute('data-index'));
          if (currentPlayingIndex === index) return;

          if (currentPlayingIndex !== null) {
            const prevVideoElem = document.getElementById("tcplayer-container-" + currentPlayingIndex);
            if (prevVideoElem) prevVideoElem.style.display = 'none';
            const prevBlock = prevVideoElem?.parentElement;
            prevBlock?.querySelector('.jump-btn')?.style.setProperty('display', 'none');
            players[currentPlayingIndex]?.pause();
          }

          const currentVideoElem = document.getElementById("tcplayer-container-" + index);
          currentVideoElem.style.display = 'block';
          const currentBlock = this.parentElement;
          currentBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
          currentBlock.querySelector('.jump-btn').style.display = 'block';
          players[index]?.play();
          currentPlayingIndex = index;
        });
      });
    }

    loadVideos();
  </script>
</body>
</html>
