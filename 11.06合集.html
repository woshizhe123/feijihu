<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>11.06🍉合集</title>
  <link href="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/tcplayer.min.css" rel="stylesheet" />
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/libs/hls.min.0.13.2m.js"></script>
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.5.0/tcplayer.v4.5.0.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #e0f7ff, #ffffff);
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #111;
      margin-bottom: 30px;
    }

    .video-block {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 15px;
      margin-bottom: 30px;
    }

    .video-title {
      display: block;
      background: #0094ff;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      text-align: left; /* 修改为靠左对齐 */
    }

    .video-title:hover {
      background: #0079cc;
    }

    .tcplayer-container {
      display: none;
      width: 100%;
      height: 580px;
      max-width: 1080px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
    }

    .jump-btn {
      display: none;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #ff6a00;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .jump-btn:hover {
      background-color: #e85c00;
    }
  </style>
</head>
<body>
  <h1>11.06🍉合集</h1>
  <div id="content">加载中...</div>

  <script>
    const players = [];
    let currentPlayingIndex = null;

    function getLocalData() {
      return {
        data_mp4: [
          { title: "吃🍉今日探店，🐔质量真高", url: "http://aod.cos.tx.xmcdn.com/storages/13d4-audiofreehighqps/79/90/GAqhqKwM4iDrACAAAAQxC59U.mp4" },
          { title: "吃🍉酒吧瘙🐔，真够瘙的", url: "http://aod.cos.tx.xmcdn.com/storages/6666-audiofreehighqps/7B/97/GKwRIDoM4iGvABrZ_gQxC_2x.mp4" },
          { title: "吃🍉羡慕吗😍", url: "http://aod.cos.tx.xmcdn.com/storages/4add-audiofreehighqps/AD/AA/GKwRIasM4iHxABslrAQxDCLC.mp4" },
          { title: "吃🍉正在野战呢，打扰人家，哥们吓坏了", url: "http://aod.cos.tx.xmcdn.com/storages/5491-audiofreehighqps/F0/00/GKwRIUEM4iI9AA2CPAQxDE8t.mp4" },
          { title: "吃🍉精神小伙计打架-大乱斗", url: "http://aod.cos.tx.xmcdn.com/storages/4328-audiofreehighqps/53/AA/GAqhfZkM4iLGACAAAAQxDKQV.mp4" },
          { title: "吃🍉包厢文化 😘 集美绝对湿了...", url: "http://aod.cos.tx.xmcdn.com/storages/4134-audiofreehighqps/3E/8A/GKwRIUEM4iMyACAAAAQxDNlj.mp4" },
          { title: "吃🍉养这种东西...😔这狗七年了....老狗了....给自己狗咬了找谁赔?? ", url: "http://aod.cos.tx.xmcdn.com/storages/7523-audiofreehighqps/65/EA/GAqhntAM4iOeACAAAAQxDREE.mp4" },
          { title: "吃🍉女朋友被别人c了！一边喊别人爸爸一边给我打语音！给这哥们气的手都发抖了", url: "http://aod.cos.tx.xmcdn.com/storages/1d0c-audiofreehighqps/C2/87/GKwRIUEM4iP_ACAAAAQxDUDh.mp4" },
          { title: "吃🍉洞穴 探险 着发现 山洞 内有一具 #女尸 无具体信息～", url: "http://aod.cos.tx.xmcdn.com/storages/a139-audiofreehighqps/3F/71/GAqh_aQM4iR_ACAAAAQxDYNO.mp4" },
          { title: "吃🍉 #女仆  ", url: "http://aod.cos.tx.xmcdn.com/storages/d6fd-audiofreehighqps/08/CB/GAqhntAM4iTgACAAAAQxDa9S.mp4" },
          { title: "吃🍉羡慕 🍋 春风 车主 ##遛狗 😑 #主人的任务", url: "http://aod.cos.tx.xmcdn.com/storages/dfcb-audiofreehighqps/0A/97/GAqh9sAM4iVzABCF8QQxDf3i.mp4" },
          { title: "吃🍉今日闪现合集", url: "http://aod.cos.tx.xmcdn.com/storages/bc4f-audiofreehighqps/42/94/GKwRIMAM4iZeACAAAAQxDoaq.mp4" },
        ],
        btn_text: '加入吃瓜微信群',
        btn_link: 'https://mp.weixin.qq.com/s/uGSBdlVlSHMpXLkxdOlHOA',
        title: '转发＝更新的动力'
      };
    }

    async function loadVideos() {
      const data = getLocalData();
      document.title = data.title;

      const container = document.getElementById('content');
      container.innerHTML = '';

      data.data_mp4.forEach((item, index) => {
        const videoId = "tcplayer-container-" + index;
        const block = document.createElement('div');
        block.className = 'video-block';
        block.innerHTML = `
          <span class="video-title" data-index="${index}">${index + 1}. ${item.title}</span>
          <video id="${videoId}" class="tcplayer-container" preload="auto" playsinline webkit-playsinline></video>
          <button class="jump-btn">${data.btn_text}</button>
        `;
        container.appendChild(block);

        const jumpBtn = block.querySelector('.jump-btn');
        jumpBtn.onclick = () => window.location.href = data.btn_link;

        setTimeout(() => {
          const player = TCPlayer(videoId, { reportable: false });
          player.src(item.url);
          player.pause();
          players[index] = player;
        }, 0);
      });

      document.querySelectorAll('.video-title').forEach(titleElem => {
        titleElem.addEventListener('click', function () {
          const index = parseInt(this.getAttribute('data-index'));
          if (currentPlayingIndex === index) return;

          if (currentPlayingIndex !== null) {
            const prevVideoElem = document.getElementById("tcplayer-container-" + currentPlayingIndex);
            if (prevVideoElem) prevVideoElem.style.display = 'none';
            const prevBlock = prevVideoElem?.parentElement;
            prevBlock?.querySelector('.jump-btn')?.style.setProperty('display', 'none');
            players[currentPlayingIndex]?.pause();
          }

          const currentVideoElem = document.getElementById("tcplayer-container-" + index);
          currentVideoElem.style.display = 'block';
          const currentBlock = this.parentElement;
          currentBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
          currentBlock.querySelector('.jump-btn').style.display = 'block';
          players[index]?.play();
          currentPlayingIndex = index;
        });
      });
    }

    loadVideos();
  </script>
</body>
</html>
