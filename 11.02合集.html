<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>11.02🍉合集</title>
  <link href="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/tcplayer.min.css" rel="stylesheet" />
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/libs/hls.min.0.13.2m.js"></script>
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.5.0/tcplayer.v4.5.0.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #e0f7ff, #ffffff);
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #111;
      margin-bottom: 30px;
    }

    .video-block {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 15px;
      margin-bottom: 30px;
    }

    .video-title {
      display: block;
      background: #0094ff;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      text-align: left; /* 修改为靠左对齐 */
    }

    .video-title:hover {
      background: #0079cc;
    }

    .tcplayer-container {
      display: none;
      width: 100%;
      height: 580px;
      max-width: 1080px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
    }

    .jump-btn {
      display: none;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #ff6a00;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .jump-btn:hover {
      background-color: #e85c00;
    }
  </style>
</head>
<body>
  <h1>11.02🍉合集</h1>
  <div id="content">加载中...</div>

  <script>
    const players = [];
    let currentPlayingIndex = null;

    function getLocalData() {
      return {
        data_mp4: [
          { title: "吃🍉装空调摔下来了 这么多人看着也不打120", url: "http://aod.cos.tx.xmcdn.com/storages/dba3-audiofreehighqps/D5/74/GKwRIMAM3MV-ACAAAAQuoMcx.mp4" },
          { title: "吃🍉🌚漫展，这跟没穿有啥区别？", url: "http://aod.cos.tx.xmcdn.com/storages/95ef-audiofreehighqps/FD/76/GAqhntAM3MXyACAAAAQuoQxb.mp4" },
          { title: "吃🍉卧槽🤣🤣喝多了，幻想自己在曹🖊", url: "http://aod.cos.tx.xmcdn.com/storages/108b-audiofreehighqps/EE/A6/GAqhg3wM3MY7ACAAAAQuoTP7.mp4" },
          { title: "吃🍉川妹开放滴很", url: "http://aod.cos.tx.xmcdn.com/storages/c9c0-audiofreehighqps/B7/1F/GAqh4zIM3MawACAAAAQuoXat.mp4" },
          { title: "吃🍉广场舞 #骚逼 在干什么 ！", url: "http://aod.cos.tx.xmcdn.com/storages/e9d0-audiofreehighqps/B8/CA/GKwRIJEM3MdmACAAAAQuofe8.mp4" },
          { title: "吃🍉#扫街 #探店 #记者暗访 200块 小贵 ～ #鸡 - #问价", url: "http://aod.cos.tx.xmcdn.com/storages/8df0-audiofreehighqps/10/99/GAqhfZkM3MgFACAAAAQuonNf.mp4" },
          { title: "吃🍉擦边短剧 少女的猎心计划", url: "http://aod.cos.tx.xmcdn.com/storages/a594-audiofreehighqps/D0/6A/GKwRIJEM3MhSACAAAAQuoqOn.mp4" },
          { title: "吃🍉男人为什么喜欢内射？   #性爱小课堂", url: "http://aod.cos.tx.xmcdn.com/storages/7cf5-audiofreehighqps/39/5A/GKwRIJIM3MiuACAAAAQuouBO.mp4" },
          { title: "吃🍉老年人玩的更花，只是不会给我们推送", url: "http://aod.cos.tx.xmcdn.com/storages/4cfc-audiofreehighqps/70/B3/GAqhVp8M3MjxACAAAAQuow-n.mp4" },
          { title: "吃🍉跳楼 这下好了，摔又没摔死，摔了个半死！ ", url: "http://aod.cos.tx.xmcdn.com/storages/7f94-audiofreehighqps/1A/DB/GAqh4zIM3MlEACAAAAQuo0hJ.mp4" },
          { title: "吃🍉大家给我低调一点！ #精神小伙 #社会人", url: "http://aod.cos.tx.xmcdn.com/storages/c357-audiofreehighqps/B8/10/GAqh4zIM3Mn_ACAAAAQuo8sQ.mp4" },
          { title: "吃🍉今日快手露出闪现合集", url: "http://aod.cos.tx.xmcdn.com/storages/ea33-audiofreehighqps/AE/62/GKwRIRwM3MrNACAAAAQupFdp.mp4" },
        ],
        btn_text: '加入吃瓜微信群',
        btn_link: 'https://mp.weixin.qq.com/s/uGSBdlVlSHMpXLkxdOlHOA',
        title: '转发＝更新的动力'
      };
    }

    async function loadVideos() {
      const data = getLocalData();
      document.title = data.title;

      const container = document.getElementById('content');
      container.innerHTML = '';

      data.data_mp4.forEach((item, index) => {
        const videoId = "tcplayer-container-" + index;
        const block = document.createElement('div');
        block.className = 'video-block';
        block.innerHTML = `
          <span class="video-title" data-index="${index}">${index + 1}. ${item.title}</span>
          <video id="${videoId}" class="tcplayer-container" preload="auto" playsinline webkit-playsinline></video>
          <button class="jump-btn">${data.btn_text}</button>
        `;
        container.appendChild(block);

        const jumpBtn = block.querySelector('.jump-btn');
        jumpBtn.onclick = () => window.location.href = data.btn_link;

        setTimeout(() => {
          const player = TCPlayer(videoId, { reportable: false });
          player.src(item.url);
          player.pause();
          players[index] = player;
        }, 0);
      });

      document.querySelectorAll('.video-title').forEach(titleElem => {
        titleElem.addEventListener('click', function () {
          const index = parseInt(this.getAttribute('data-index'));
          if (currentPlayingIndex === index) return;

          if (currentPlayingIndex !== null) {
            const prevVideoElem = document.getElementById("tcplayer-container-" + currentPlayingIndex);
            if (prevVideoElem) prevVideoElem.style.display = 'none';
            const prevBlock = prevVideoElem?.parentElement;
            prevBlock?.querySelector('.jump-btn')?.style.setProperty('display', 'none');
            players[currentPlayingIndex]?.pause();
          }

          const currentVideoElem = document.getElementById("tcplayer-container-" + index);
          currentVideoElem.style.display = 'block';
          const currentBlock = this.parentElement;
          currentBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
          currentBlock.querySelector('.jump-btn').style.display = 'block';
          players[index]?.play();
          currentPlayingIndex = index;
        });
      });
    }

    loadVideos();
  </script>
</body>
</html>
