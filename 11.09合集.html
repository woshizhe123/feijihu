<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>11.09🍉合集</title>
  <link href="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/tcplayer.min.css" rel="stylesheet" />
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.2.1/libs/hls.min.0.13.2m.js"></script>
  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.5.0/tcplayer.v4.5.0.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #e0f7ff, #ffffff);
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #111;
      margin-bottom: 30px;
    }

    .video-block {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 15px;
      margin-bottom: 30px;
    }

    .video-title {
      display: block;
      background: #0094ff;
      color: white;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      text-align: left; /* 修改为靠左对齐 */
    }

    .video-title:hover {
      background: #0079cc;
    }

    .tcplayer-container {
      display: none;
      width: 100%;
      height: 580px;
      max-width: 1080px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
    }

    .jump-btn {
      display: none;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #ff6a00;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .jump-btn:hover {
      background-color: #e85c00;
    }
  </style>
</head>
<body>
  <h1>11.09🍉合集</h1>
  <div id="content">加载中...</div>

  <script>
    const players = [];
    let currentPlayingIndex = null;

    function getLocalData() {
      return {
        data_mp4: [
          { title: "吃🍉漫展 #兔女郎 #奶子 （果子）真大 ！", url: "http://aod.cos.tx.xmcdn.com/storages/1fcb-audiofreehighqps/C7/FC/GKwRIRwM5fZfACAAAAQyxcVn.mp4" },
          { title: "吃🍉湿了 #肌肉男 #男模 太猛了", url: "http://aod.cos.tx.xmcdn.com/storages/4985-audiofreehighqps/55/5B/GAqhfD0M5fbHACAAAAQyxhaF.mp4" },
          { title: "吃🍉直播 #露点 能露出来的都是设定好的 #流量密码", url: "http://aod.cos.tx.xmcdn.com/storages/ed34-audiofreehighqps/6D/CE/GAqh9sAM5fcmACAAAAQyxk5K.mp4" },
          { title: "吃🍉住手 不要再打了啦 ！ #打架 #精神小伙  打的太狠了...", url: "http://aod.cos.tx.xmcdn.com/storages/2df5-audiofreehighqps/0C/A6/GAqhfD0M5fd0ACAAAAQyxnmA.mp4" },
          { title: "吃🍉抓奸🤡", url: "http://aod.cos.tx.xmcdn.com/storages/ab42-audiofreehighqps/66/4D/GKwRIUEM5ffbACAAAAQyxrsg.mp4" },
          { title: "吃🍉为了养家糊口  都不容易呀！ #低俗表演.", url: "http://aod.cos.tx.xmcdn.com/storages/9811-audiofreehighqps/06/51/GAqhntAM5fiaACAAAAQyxy5e.mp4" },
          { title: "吃🍉集美 私密 交流 #语音 切无外传 ！ ", url: "http://aod.cos.tx.xmcdn.com/storages/631f-audiofreehighqps/B0/74/GAqh4zIM5fjwACAAAAQyx3CL.mp4" },
          { title: "吃🍉流动的🐔婆，在货车司机休息时间询问环需不需要服务", url: "http://aod.cos.tx.xmcdn.com/storages/783b-audiofreehighqps/20/FB/GKwRIUEM5fltACAAAAQyx7ls.mp4" },
          { title: "吃🍉这质量200块可以爽一下试试🐔", url: "http://aod.cos.tx.xmcdn.com/storages/ad0f-audiofreehighqps/70/69/GKwRIJEM5fnLACAAAAQyx-zr.mp4" },
          { title: "吃🍉国外还是开放，音乐节现场抠逼  ", url: "http://aod.cos.tx.xmcdn.com/storages/ca41-audiofreehighqps/03/52/GAqhqKwM5foEABFmHwQyyA0v.mp4" },
          { title: "吃🍉抓小三 原配应该是河南人到泰州抓小三！？", url: "http://aod.cos.tx.xmcdn.com/storages/9b54-audiofreehighqps/C9/87/GKwRIJEM5fp0ACAAAAQyyFDC.mp4" },
          { title: "吃🍉这么小就 #鸡 ", url: "http://aod.cos.tx.xmcdn.com/storages/b3ee-audiofreehighqps/2E/0B/GKwRIW4M5fq7ABU4uQQyyHaG.mp4" },
        ],
        btn_text: '加入吃瓜微信群',
        btn_link: 'https://mp.weixin.qq.com/s/uGSBdlVlSHMpXLkxdOlHOA',
        title: '转发＝更新的动力'
      };
    }

    async function loadVideos() {
      const data = getLocalData();
      document.title = data.title;

      const container = document.getElementById('content');
      container.innerHTML = '';

      data.data_mp4.forEach((item, index) => {
        const videoId = "tcplayer-container-" + index;
        const block = document.createElement('div');
        block.className = 'video-block';
        block.innerHTML = `
          <span class="video-title" data-index="${index}">${index + 1}. ${item.title}</span>
          <video id="${videoId}" class="tcplayer-container" preload="auto" playsinline webkit-playsinline></video>
          <button class="jump-btn">${data.btn_text}</button>
        `;
        container.appendChild(block);

        const jumpBtn = block.querySelector('.jump-btn');
        jumpBtn.onclick = () => window.location.href = data.btn_link;

        setTimeout(() => {
          const player = TCPlayer(videoId, { reportable: false });
          player.src(item.url);
          player.pause();
          players[index] = player;
        }, 0);
      });

      document.querySelectorAll('.video-title').forEach(titleElem => {
        titleElem.addEventListener('click', function () {
          const index = parseInt(this.getAttribute('data-index'));
          if (currentPlayingIndex === index) return;

          if (currentPlayingIndex !== null) {
            const prevVideoElem = document.getElementById("tcplayer-container-" + currentPlayingIndex);
            if (prevVideoElem) prevVideoElem.style.display = 'none';
            const prevBlock = prevVideoElem?.parentElement;
            prevBlock?.querySelector('.jump-btn')?.style.setProperty('display', 'none');
            players[currentPlayingIndex]?.pause();
          }

          const currentVideoElem = document.getElementById("tcplayer-container-" + index);
          currentVideoElem.style.display = 'block';
          const currentBlock = this.parentElement;
          currentBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
          currentBlock.querySelector('.jump-btn').style.display = 'block';
          players[index]?.play();
          currentPlayingIndex = index;
        });
      });
    }

    loadVideos();
  </script>
</body>
</html>
